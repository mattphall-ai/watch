<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio RX — Built to Evolve</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131313'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2b400'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" id="site-header">
      <div class="header-inner">
        <span class="logo">STUDIO RX</span>
        <a class="tag-link" href="#finale">
          <span>Built to Evolve</span>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
      <div class="header-rule"></div>
    </header>

    <main>
      <div class="parallax-wrap" id="parallax-wrap">
        <div class="stage-sticky">
          <div class="stage-inner">
            <div class="copy-block" id="copy-block">
              <p class="lead">
                Our goal is to partner with Neurocrine to build a
                next-generation marketing technology ecosystem that enables
                greater speed, scalability, governance, and innovation
                across your digital operations.
              </p>
            </div>

            <div class="video-card" id="video-card">
              <div class="video-visual">
                <canvas id="wave"></canvas>
                <button class="play-btn" aria-label="Play video">
                  <svg width="22" height="24" viewBox="0 0 22 24" fill="none" aria-hidden="true">
                    <path d="M20.5 10.7c1.3.8 1.3 2.7 0 3.5L3 24.5C1.7 25.3 0 24.4 0 22.8V1.2C0-.4 1.7-1.3 3-.5l17.5 11.2z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
              <div class="video-meta">
                <span class="video-title" id="video-title">AI CONTENT CREATION</span>
                <a class="video-link" href="#" id="video-link">
                  <span>VIDEO</span>
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M3 11L11 3M11 3H4M11 3V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="finale" id="finale">
        <div class="finale-inner">
          <span class="logo big reveal">STUDIO RX</span>
          <h2 class="finale-tag reveal">Built to Evolve</h2>
          <svg class="finale-arrow reveal" width="64" height="24" viewBox="0 0 64 24" fill="none" aria-hidden="true">
            <path d="M1 12H60M60 12L49 1M60 12L49 23" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </section>
    </main>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-line"></div>
      <div class="progress-dot" id="progress-dot"></div>
      <svg class="progress-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <script src="script.js"></script>
  </body>
</html>
